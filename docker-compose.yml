services:
  telegram-bot:
    container_name: telegram-bot
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Europe/Rome
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
